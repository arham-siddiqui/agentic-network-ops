global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8000]
  - job_name: worker
    static_configs:
      - targets: [worker:8000]
  - job_name: impairment-proxy
    static_configs:
      - targets: [proxy-admin:8474]
  # Ground-truth marker for dashboards and evaluation only; never a detection input.
  - job_name: network-fault-controller
    static_configs:
      - targets: [network-fault-controller:9101]
